<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NVOIP - Telefonia VoIP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 500: '#3b82f6', 600: '#2563eb' },
                        dark: { 700: '#374151', 800: '#1f2937', 900: '#111827' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-900 text-white h-screen overflow-hidden">
    <div class="h-full overflow-y-auto p-6">
        <div class="mb-6 flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-bold mb-1">Telefonia VoIP</h1>
                <p class="text-gray-400 text-sm">NVOIP Integration - Ramais e CDR</p>
            </div>
            <div id="callTimer" class="hidden px-4 py-2 bg-green-600 rounded-lg flex items-center gap-2 animate-pulse">
                <i class="fas fa-phone-volume text-white"></i>
                <span id="timerDisplay" class="font-mono text-lg font-bold">00:00</span>
                <button onclick="NVOIP.endCall()" class="ml-2 px-3 py-1 bg-red-600 hover:bg-red-700 rounded text-sm">
                    <i class="fas fa-phone-slash"></i> Encerrar
                </button>
            </div>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="space-y-6">
                <div class="bg-dark-800 border border-dark-700 rounded-xl p-6">
                    <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                        <i class="fas fa-headset text-primary-500"></i> Softphone
                    </h2>
                    <div class="bg-dark-900 rounded-lg p-4 mb-4 text-center">
                        <p class="text-xs text-gray-400 mb-1">Seu Ramal</p>
                        <p class="text-3xl font-mono font-bold text-primary-500" id="myExtension">10--</p>
                        <p class="text-sm text-gray-400 mt-2" id="myName">---</p>
                        <span class="inline-block mt-2 px-3 py-1 bg-green-500/20 text-green-400 rounded-full text-xs">
                            <i class="fas fa-circle text-xs mr-1"></i> Online
                        </span>
                    </div>
                    <div class="grid grid-cols-3 gap-2 mb-4" id="dialpad"></div>
                    <input id="dialNumber" type="text" placeholder="(XX) XXXXX-XXXX" 
                           class="w-full p-3 bg-dark-900 border border-dark-700 rounded-lg text-center font-mono mb-3 focus:outline-none focus:border-primary-500">
                    <div class="flex gap-2">
                        <button onclick="NVOIP.makeCall('')" class="flex-1 py-3 bg-green-600 hover:bg-green-700 rounded-lg font-semibold transition-colors flex items-center justify-center gap-2">
                            <i class="fas fa-phone"></i> Ligar
                        </button>
                        <button class="flex-1 py-3 bg-dark-700 hover:bg-dark-600 rounded-lg font-semibold transition-colors">
                            <i class="fas fa-volume-up"></i>
                        </button>
                    </div>
                </div>
                <div class="bg-dark-800 border border-dark-700 rounded-xl p-6">
                    <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                        <i class="fas fa-search text-primary-500"></i> Buscar Cliente
                    </h2>
                    <input id="searchPhone" type="text" placeholder="Digite o telefone..." 
                           class="w-full p-3 bg-dark-900 border border-dark-700 rounded-lg focus:outline-none focus:border-primary-500 mb-3">
                    <button onclick="NVOIP.searchClientByPhone(document.getElementById('searchPhone').value)" 
                            class="w-full py-2 bg-primary-600 hover:bg-primary-700 rounded-lg transition-colors">
                        <i class="fas fa-search mr-2"></i> Localizar
                    </button>
                </div>
            </div>
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-dark-800 border border-dark-700 rounded-xl p-6">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-lg font-bold flex items-center gap-2">
                            <i class="fas fa-building text-primary-500"></i> Ramais da Empresa
                        </h2>
                        <button class="px-3 py-1.5 bg-dark-700 hover:bg-dark-600 rounded-lg text-sm transition-colors">
                            <i class="fas fa-plus mr-1"></i> Novo Ramal
                        </button>
                    </div>
                    <div id="extensionsList" class="space-y-3"></div>
                </div>
                <div class="bg-dark-800 border border-dark-700 rounded-xl p-6">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-lg font-bold flex items-center gap-2">
                            <i class="fas fa-history text-primary-500"></i> Histórico de Chamadas (CDR)
                        </h2>
                        <div class="flex gap-2">
                            <select class="px-3 py-1.5 bg-dark-900 border border-dark-700 rounded-lg text-sm focus:outline-none">
                                <option>Todos os tipos</option>
                                <option>Recebidas</option>
                                <option>Realizadas</option>
                                <option>Perdidas</option>
                            </select>
                            <button class="px-3 py-1.5 bg-dark-700 hover:bg-dark-600 rounded-lg text-sm transition-colors">
                                <i class="fas fa-download mr-1"></i> Exportar
                            </button>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead>
                                <tr class="border-b border-dark-700 text-left text-xs text-gray-400 uppercase">
                                    <th class="py-3 px-4">Status</th>
                                    <th class="py-3 px-4">Cliente</th>
                                    <th class="py-3 px-4">Origem</th>
                                    <th class="py-3 px-4">Destino</th>
                                    <th class="py-3 px-4">Duração</th>
                                    <th class="py-3 px-4">Data/Hora</th>
                                    <th class="py-3 px-4">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="cdrList"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../../js/core/auth.js"></script>
    <script src="../../js/components/toast.js"></script>
    <script src="voip.js"></script>
    <script>
        // Setup dialpad dynamically
        const dialpad = document.getElementById('dialpad');
        ['1','2','3','4','5','6','7','8','9','*','0','#'].forEach(key => {
            const btn = document.createElement('button');
            btn.className = 'p-3 bg-dark-700 hover:bg-dark-600 rounded-lg font-mono text-lg transition-colors';
            btn.textContent = key;
            btn.onclick = () => document.getElementById('dialNumber').value += key;
            dialpad.appendChild(btn);
        });
        
        // Set user info
        const user = Auth.checkSession();
        if(user) {
            document.getElementById('myExtension').textContent = '100' + user.id;
            document.getElementById('myName').textContent = user.nome;
        }
    </script>
</body>
</html>
