<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Externo - Atendimento ao Cliente</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 500: '#3b82f6', 600: '#2563eb' },
                        dark: { 700: '#374151', 800: '#1f2937', 900: '#111827' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-900 text-white h-screen overflow-hidden">
    
    <div class="flex h-full">
        
        <!-- Fila de Atendimentos -->
        <div class="w-80 bg-dark-800 border-r border-dark-700 flex flex-col">
            
            <!-- Header -->
            <div class="p-4 border-b border-dark-700">
                <h1 class="text-xl font-bold mb-3">Atendimento ao Cliente</h1>
                
                <!-- Stats -->
                <div class="grid grid-cols-2 gap-2 mb-3">
                    <div class="bg-yellow-500/10 border border-yellow-500/30 rounded-lg p-2 text-center">
                        <p class="text-xs text-yellow-400">Aguardando</p>
                        <p id="statPending" class="text-lg font-bold text-yellow-400">0</p>
                    </div>
                    <div class="bg-blue-500/10 border border-blue-500/30 rounded-lg p-2 text-center">
                        <p class="text-xs text-blue-400">Em andamento</p>
                        <p id="statProgress" class="text-lg font-bold text-blue-400">0</p>
                    </div>
                </div>
                
                <!-- Filtros -->
                <div class="flex gap-2">
                    <button class="flex-1 py-1 px-2 text-xs bg-primary-600 rounded">Todos</button>
                    <button class="flex-1 py-1 px-2 text-xs bg-dark-700 hover:bg-dark-600 rounded">Pendentes</button>
                    <button class="flex-1 py-1 px-2 text-xs bg-dark-700 hover:bg-dark-600 rounded">Meus</button>
                </div>
            </div>
            
            <!-- Lista da Fila -->
            <div id="queueList" class="flex-1 overflow-y-auto">
                <!-- Preenchido via JS -->
            </div>
        </div>
        
        <!-- Área de Atendimento -->
        <div class="flex-1 flex bg-dark-900">
            
            <!-- Chat Principal -->
            <div class="flex-1 flex flex-col border-r border-dark-700">
                
                <!-- Header -->
                <div class="p-4 border-b border-dark-700 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-gradient-to-r from-green-600 to-emerald-600 flex items-center justify-center">
                            <i class="fas fa-user text-white"></i>
                        </div>
                        <div>
                            <h2 id="chatClientName" class="font-semibold">Selecione um atendimento</h2>
                            <p id="chatClientStatus" class="text-xs text-gray-400">...</p>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-2">
                        <button class="px-3 py-2 bg-green-600 hover:bg-green-700 rounded-lg text-sm transition-colors flex items-center gap-2">
                            <i class="fab fa-whatsapp"></i> WhatsApp
                        </button>
                        <button class="px-3 py-2 bg-dark-700 hover:bg-dark-600 rounded-lg text-sm transition-colors flex items-center gap-2">
                            <i class="fas fa-phone"></i> Ligar
                        </button>
                    </div>
                </div>
                
                <!-- Mensagens -->
                <div id="messagesContainer" class="flex-1 overflow-y-auto p-4">
                    <div class="flex-1 flex items-center justify-center text-gray-400">
                        <div class="text-center">
                            <i class="fas fa-headset text-4xl mb-3 opacity-50"></i>
                            <p>Selecione um atendimento da fila</p>
                            <p class="text-sm">O histórico do cliente aparecerá aqui</p>
                        </div>
                    </div>
                </div>
                
                <!-- Input -->
                <div class="p-4 border-t border-dark-700">
                    <!-- Respostas rápidas -->
                    <div class="mb-3 flex gap-2 overflow-x-auto pb-2">
                        <button onclick="ChatExterno.insertQuickResponse('Olá! Como posso ajudar?')" 
                                class="px-3 py-1 bg-dark-700 hover:bg-dark-600 rounded-full text-xs whitespace-nowrap transition-colors">
                            👋 Saudação
                        </button>
                        <button onclick="ChatExterno.insertQuickResponse('Vou verificar para o senhor(a).')" 
                                class="px-3 py-1 bg-dark-700 hover:bg-dark-600 rounded-full text-xs whitespace-nowrap transition-colors">
                            ⏳ Verificar
                        </button>
                        <button onclick="ChatExterno.insertQuickResponse('Posso ajudar em mais alguma coisa?')" 
                                class="px-3 py-1 bg-dark-700 hover:bg-dark-600 rounded-full text-xs whitespace-nowrap transition-colors">
                            ❓ Mais algo
                        </button>
                        <button onclick="ChatExterno.insertQuickResponse('Obrigado pelo contato. Tenha um bom dia!')" 
                                class="px-3 py-1 bg-dark-700 hover:bg-dark-600 rounded-full text-xs whitespace-nowrap transition-colors">
                            👋 Despedida
                        </button>
                    </div>
                    
                    <div class="flex items-center gap-3">
                        <button class="p-2 hover:bg-dark-700 rounded-lg transition-colors" title="Anexar">
                            <i class="fas fa-paperclip text-gray-400"></i>
                        </button>
                        <button class="p-2 hover:bg-dark-700 rounded-lg transition-colors" title="Emoji">
                            <i class="far fa-smile text-gray-400"></i>
                        </button>
                        
                        <input id="messageInput" type="text" placeholder="Digite sua resposta..." 
                               class="flex-1 px-4 py-2 bg-dark-800 border border-dark-700 rounded-lg focus:outline-none focus:border-primary-500">
                        
                        <button id="sendMessageBtn" class="p-3 bg-primary-600 hover:bg-primary-700 rounded-lg transition-colors">
                            <i class="fas fa-paper-plane text-white"></i>
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Informações do Cliente -->
            <div class="w-80 bg-dark-800 overflow-y-auto">
                <div class="p-4 border-b border-dark-700">
                    <h3 class="font-bold">Informações do Cliente</h3>
                </div>
                <div id="clientInfo">
                    <div class="p-8 text-center text-gray-400">
                        <i class="fas fa-user-circle text-4xl mb-3 opacity-50"></i>
                        <p class="text-sm">Selecione um atendimento para ver os dados do cliente</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="../../js/core/auth.js"></script>
    <script src="../../js/components/toast.js"></script>
    <script src="atendimento.js"></script>
    
    <script>
        // Seed inicial de atendimentos mock
        const seedAttendances = () => {
            const existing = localStorage.getItem('isp_chat_external');
            if (!existing) {
                const clients = JSON.parse(localStorage.getItem('isp_clients') || '[]');
                const attendances = clients.slice(0, 3).map((client, idx) => ({
                    id: 5001 + idx,
                    cliente: {
                        ...client,
                        data_criacao: new Date().toISOString()
                    },
                    status: idx === 0 ? 'pending' : 'in_progress',
                    setor: idx === 0 ? null : 'Suporte Técnico',
                    timestamp: new Date(Date.now() - (idx * 300000)).toISOString(),
                    mensagens: idx === 1 ? [
                        {
                            id: 1,
                            sender: 'cliente',
                            content: 'Minha internet está lenta hoje',
                            timestamp: new Date().toISOString()
                        }
                    ] : [],
                    ultimo_mensagem: idx === 1 ? 'Minha internet está lenta hoje' : null
                }));
                localStorage.setItem('isp_chat_external', JSON.stringify(attendances));
            }
        };
        
        seedAttendances();
        
        // Helper para respostas rápidas
        ChatExterno.insertQuickResponse = (text) => {
            const input = document.getElementById('messageInput');
            if (input) {
                input.value = text;
                input.focus();
            }
        };
    </script>
</body>
</html>
