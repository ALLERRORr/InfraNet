<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Interno - ISP Manager Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' },
                        dark: { 700: '#374151', 800: '#1f2937', 900: '#111827' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-900 text-white h-screen overflow-hidden">
    
    <div class="flex h-full">
        
        <!-- Sidebar de Chats -->
        <div class="w-80 bg-dark-800 border-r border-dark-700 flex flex-col">
            
            <!-- Header -->
            <div class="p-4 border-b border-dark-700">
                <h1 class="text-xl font-bold mb-3">Chat Interno</h1>
                
                <!-- Busca -->
                <div class="relative">
                    <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
                    <input type="text" placeholder="Buscar conversas..." 
                           class="w-full pl-10 pr-4 py-2 bg-dark-900 border border-dark-700 rounded-lg text-sm focus:outline-none focus:border-primary-500">
                </div>
                
                <!-- Status do usuário -->
                <div class="flex items-center gap-2 mt-3">
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                    <span class="text-xs text-gray-400">Online</span>
                </div>
            </div>
            
            <!-- Lista de Chats -->
            <div id="chatList" class="flex-1 overflow-y-auto p-3 space-y-2">
                <!-- Preenchido via JS -->
            </div>
        </div>
        
        <!-- Área Principal do Chat -->
        <div class="flex-1 flex flex-col bg-dark-900">
            
            <!-- Header do Chat Ativo -->
            <div class="p-4 border-b border-dark-700 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-r from-blue-600 to-indigo-600 flex items-center justify-center">
                        <i class="fas fa-users text-white"></i>
                    </div>
                    <div>
                        <h2 id="chatHeaderName" class="font-semibold">Selecione um chat</h2>
                        <p id="chatHeaderStatus" class="text-xs text-gray-400">...</p>
                    </div>
                </div>
                
                <div class="flex items-center gap-3">
                    <button class="p-2 hover:bg-dark-700 rounded-lg transition-colors" title="Chamada de voz">
                        <i class="fas fa-phone text-gray-400"></i>
                    </button>
                    <button class="p-2 hover:bg-dark-700 rounded-lg transition-colors" title="Chamada de vídeo">
                        <i class="fas fa-video text-gray-400"></i>
                    </button>
                    <button class="p-2 hover:bg-dark-700 rounded-lg transition-colors" title="Mais opções">
                        <i class="fas fa-ellipsis-v text-gray-400"></i>
                    </button>
                </div>
            </div>
            
            <!-- Mensagens -->
            <div id="messagesContainer" class="flex-1 overflow-y-auto p-4">
                <div class="flex-1 flex items-center justify-center text-gray-400">
                    <div class="text-center">
                        <i class="fas fa-comments text-4xl mb-3 opacity-50"></i>
                        <p>Selecione uma conversa para começar</p>
                    </div>
                </div>
            </div>
            
            <!-- Input de Mensagem -->
            <div class="p-4 border-t border-dark-700">
                <div class="flex items-center gap-3">
                    <button class="p-2 hover:bg-dark-700 rounded-lg transition-colors" title="Anexar arquivo">
                        <i class="fas fa-paperclip text-gray-400"></i>
                    </button>
                    <button class="p-2 hover:bg-dark-700 rounded-lg transition-colors" title="Enviar emoji">
                        <i class="far fa-smile text-gray-400"></i>
                    </button>
                    
                    <input id="messageInput" type="text" placeholder="Digite sua mensagem..." 
                           class="flex-1 px-4 py-2 bg-dark-800 border border-dark-700 rounded-lg focus:outline-none focus:border-primary-500">
                    
                    <button id="sendMessageBtn" class="p-3 bg-primary-600 hover:bg-primary-700 rounded-lg transition-colors">
                        <i class="fas fa-paper-plane text-white"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="../../js/core/auth.js"></script>
    <script src="../../js/components/toast.js"></script>
    <script src="chat.js"></script>
</body>
</html>
